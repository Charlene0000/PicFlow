# PicFlow CI
name: PicFlow CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONUTF8: 1
  PYTHONIOENCODING: utf-8

jobs:
  # ---------- C 核心测试：三大平台并行 ----------
  core-tests:
    name: C 核心测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 编译并运行 C 单元测试
        run: python tools/run_tests.py
      - name: 编译并运行图库服务集成测试
        run: python tests/test_mock_server.py
      - name: 生成布局可视化
        if: matrix.os != 'windows-2022'
        run: |
          mkdir -p build/preview
          cc -std=c99 -O1 -I core tools/preview/preview_svg.c \
             core/picflow_layout.c core/picflow_palette.c core/picflow_catalog.c \
             -o build/preview/preview_svg -lm
          ./build/preview/preview_svg build/preview/iphone.svg 2 375 24
          ./build/preview/preview_svg build/preview/ipad.svg 3 768 24
      - name: 上传布局可视化产物
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: layout-preview
          path: build/preview/*.svg

  # ---------- iOS 真机编译（macOS runner） ----------
  ios-build:
    name: iOS 工程编译 (Xcode ${{ matrix.xcode }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        xcode: ["15.4", "16.2"]
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Xcode 版本
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      # 【关键修改】：把 C 代码和 ObjC 代码全部拷贝到 Xcode 期望的根目录
      - name: 移动源码到根目录以修复路径错误
        run: |
          # 1. 拷贝 C 源文件
          cp core/*.c .
          cp core/*.h .
          # 2. 拷贝 PicFlow 目录下的所有 ObjC 代码和资源
          cp -R PicFlow/* .

      - name: 生成 Xcode 工程
        run: python3 tools/generate_project.py

      - name: 编译 iOS 工程（模拟器目标，无需签名）
        run: |
          xcodebuild \
            -project PicFlow.xcodeproj \
            -target PicFlow \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: app-build-${{ matrix.xcode }}
          path: build/Debug-iphonesimulator/PicFlow.app
          if-no-files-found: ignore
