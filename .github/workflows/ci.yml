# PicFlow CI
name: PicFlow CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONUTF8: 1
  PYTHONIOENCODING: utf-8

jobs:
  # ---------- C 核心测试 ----------
  core-tests:
    name: C 核心测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 编译并运行 C 单元测试
        run: python tools/run_tests.py
      - name: 编译并运行图库服务集成测试
        run: python tests/test_mock_server.py

  # ---------- iOS 编译 ----------
  ios-build:
    name: iOS 工程编译 (Xcode ${{ matrix.xcode }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        xcode: ["15.4", "16.2"]
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Xcode 版本
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 用 XcodeGen 生成工程文件
        run: |
          cat > project.yml << 'EOF'
          name: PicFlow
          options:
            bundleIdPrefix: com.picflow
            deploymentTarget:
              iOS: "13.0"
            xcodeVersion: "15.0" # 【新增】：强制生成兼容 Xcode 15 的工程文件格式
          targets:
            PicFlow:
              type: application
              platform: iOS
              sources:
                - path: PicFlow
                - path: core
              settings:
                base:
                  INFOPLIST_FILE: PicFlow/Resources/Info.plist
                  CODE_SIGNING_ALLOWED: NO
                  GENERATE_INFOPLIST_FILE: NO
          EOF
          
          xcodegen generate

      - name: 编译 iOS 工程
        run: |
          xcodebuild \
            -project PicFlow.xcodeproj \
            -scheme PicFlow \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
